[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111C2E"
textColor = "#E5EDF7"
font = "sans serif"
borderColor = "#29374B"

[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
